[project]
name = "placefinder-sound"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["dopplertrack==0.3.0"]

[project.scripts]
placefinder = "placefinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ['.']
