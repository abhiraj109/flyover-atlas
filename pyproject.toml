[project]
name = "flyover-atlas"
version = "0.1.0"
description = "Estimate recording locations by matching aircraft sounds with historical flight tracks."
requires-python = ">=3.12"
dependencies = ["dopplertrack==0.3.0"]

[project.urls]
Repository = "https://github.com/abhiraj109/flyover-atlas"

[project.scripts]
flyover-atlas = "placefinder.cli:main"
placefinder = "placefinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ['.']

[tool.setuptools.package-data]
placefinder = ['workspace/*']
